<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon | Aquatic</title>
<meta name="description" content="A new aquatic world is taking shape. Sign up to be first to know when we launch.">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dark-mode.css">
<link rel="shortcut icon" href="../assets/images/icon.png" type="image/x-icon">

</head>
<body>
<main id="main">
  <section class="hero" style="min-height:100vh; display:flex; align-items:center;">
    <div class="container-wide" style="text-align:center; max-width:700px; margin-inline:auto; position:relative; z-index:2;">
      <a href="../index.html" class="brand" style="justify-content:center; margin-bottom:2rem;"><img src="../assets/images/logo.png" alt="Aquatic" class="brand-logo"></a>
      <span class="eyebrow" style="justify-content:center;">Opening Soon</span>
      <h1 style="font-size:var(--fs-h1); margin:1rem 0;">A New Aquatic World Is Taking Shape.</h1>
      <p style="font-size:1.08rem; max-width:520px; margin-inline:auto;">We're building a bigger showroom with more freshwater, marine and planted-tank stock. Leave your email and we'll let you know the moment doors open.</p>

      <div class="countdown" data-countdown="2026-12-01T10:00:00">
        <div class="countdown-item"><span class="num" data-days>00</span><span class="lbl">DAYS</span></div>
        <div class="countdown-item"><span class="num" data-hours>00</span><span class="lbl">HOURS</span></div>
        <div class="countdown-item"><span class="num" data-mins>00</span><span class="lbl">MINUTES</span></div>
        <div class="countdown-item"><span class="num" data-secs>00</span><span class="lbl">SECONDS</span></div>
      </div>

      <div class="form-success" role="status" style="justify-content:center; max-width:420px; margin-inline:auto;"><i class="bi bi-check-circle-fill"></i> You're on the list — see you soon!</div>
      <form data-validate novalidate style="display:flex; gap:.75rem; max-width:420px; margin-inline:auto; flex-wrap:wrap;">
        <div class="form-field" style="flex:1; min-width:200px; margin-bottom:0;">
          <label class="visually-hidden" for="cs-email">Email address</label>
          <input type="email" id="cs-email" name="email" placeholder="Email address" required>
        </div>
        <button type="submit" class="btn btn-primary">Notify Me</button>
      </form>
    </div>
  </section>
</main>
<script src="../assets/js/main.js"></script>
</body>
</html>
